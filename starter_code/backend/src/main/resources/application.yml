spring:
  application:
    name: lms-catalog
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  datasource:
    # Points at a MySQL 8.4 server running on the host. Create the database and
    # the lms_app user first with db-setup/01-create-users.sql.
    url: jdbc:mysql://localhost:3306/lms_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: lms_app
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo

server:
  port: 8080

logging:
  level:
    CATALOG_AUDIT: INFO
