[pytest]
# Deterministic UI smoke suite. Artifacts go to the git-ignored test-results/ directory.
testpaths = tests/ui
addopts =
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results/ui
    --junitxml=test-results/junit-ui.xml
    -p no:cacheprovider
